name: ساخت APK پول‌یار

on:
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: دریافت فایل‌ها
    uses: actions/checkout@v4

  - name: آماده‌سازی جاوا
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: نصب ابزار اندروید
    uses: android-actions/setup-android@v3

  - name: آماده‌سازی Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.9'

  - name: ساخت پروژه اندروید
    run: |
      mkdir -p app/src/main/assets
      mkdir -p app/src/main/java/com/poolyar/app

      unzip -o poolyar_v1.zip -d extracted

      HTML=$(find extracted -type f -name index.html | head -n 1)
      test -n "$HTML"
      cp "$HTML" app/src/main/assets/index.html

      cat > settings.gradle <<'EOF'
      pluginManagement {
          repositories {
              google()
              mavenCentral()
              gradlePluginPortal()
          }
      }
      dependencyResolutionManagement {
          repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
          repositories {
              google()
              mavenCentral()
          }
      }
      rootProject.name = 'Poolyar'
      include ':app'
      EOF

      cat > build.gradle <<'EOF'
      plugins {
          id 'com.android.application' version '8.7.3' apply false
      }
      EOF

      cat > app/build.gradle <<'EOF'
      plugins {
          id 'com.android.application'
      }
      android {
          namespace 'com.poolyar.app'
          compileSdk 35
          defaultConfig {
              applicationId 'com.poolyar.app'
              minSdk 23
              targetSdk 28
              versionCode 1
              versionName '1.0'
          }
      }
      EOF

      cat > app/src/main/AndroidManifest.xml <<'EOF'
      <manifest xmlns:android="http://schemas.android.com/apk/res/android">
          <application
              android:theme="@android:style/Theme.Material.Light.NoActionBar"
              android:label="پول‌یار"
              android:usesCleartextTraffic="false">
              <activity
                  android:name=".MainActivity"
                  android:exported="true">
                  <intent-filter>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent-filter>
              </activity>
          </application>
      </manifest>
      EOF

      cat > app/src/main/java/com/poolyar/app/MainActivity.java <<'EOF'
      package com.poolyar.app;

      import android.app.Activity;
      import android.os.Bundle;
      import android.webkit.WebView;
      import android.webkit.WebSettings;
      import android.view.View;
      import android.view.Window;
      import android.view.WindowManager;

      public class MainActivity extends Activity {
          @Override
          protected void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              WebView webView = new WebView(this);
              WebSettings settings = webView.getSettings();
              settings.setJavaScriptEnabled(true);
              settings.setDomStorageEnabled(true);
              settings.setAllowFileAccess(true);
              webView.setWebViewClient(new android.webkit.WebViewClient());
              setContentView(webView);
              webView.loadUrl("file:///android_asset/index.html");
          }
      }
      EOF

  - name: ساخت APK
    run: gradle --no-daemon assembleDebug

  - name: آماده‌کردن APK برای دریافت
    uses: actions/upload-artifact@v4
    with:
      name: Poolyar-APK
      path: app/build/outputs/apk/debug/app-debug.apk
